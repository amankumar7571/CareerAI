# CareerAI — local development with Docker Compose (100% free: no cloud).
#
#   docker compose up --build
#   Backend:  http://localhost:8000        (API docs at /docs)
#   Frontend: http://localhost:3000
#
# The frontend bundle is built with VITE_API_BASE_URL=http://localhost:8000,
# so the browser calls the backend directly. To point the frontend at a
# deployed backend instead, rebuild with a different build arg:
#   docker compose build --build-arg VITE_API_BASE_URL=https://<your-backend>/ frontend
#
# Data: SQLite file + uploaded resumes live in named volumes (data persists
# across `docker compose down`; use `docker compose down -v` to wipe it).
# JWT_SECRET_KEY below is a DEV-ONLY placeholder — never use it in production.
services:
  backend:
    build: ./backend
    container_name: careerai-backend
    restart: unless-stopped
    environment:
      PORT: "8000"
      DATABASE_URL: sqlite:////app/data/career_db.sqlite
      JWT_SECRET_KEY: dev-only-change-me-in-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "10080"
      CORS_ALLOW_ORIGINS: http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000
      STORAGE_BACKEND: local
      UPLOAD_DIR: /app/uploads
      # GEMINI_API_KEY: leave unset — skill extraction falls back to the
      # local spaCy / keyword path. Set it only if you want Gemini extraction.
    ports:
      - "8000:8000"
    volumes:
      - careerai-data:/app/data
      - careerai-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: careerai-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  careerai-data:
  careerai-uploads:
