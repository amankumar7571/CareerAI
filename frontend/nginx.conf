server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app fallback: let react-router handle /login, /register,
    # /dashboard instead of nginx returning 404 for those paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets: cache aggressively (Vite emits hashed filenames).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
